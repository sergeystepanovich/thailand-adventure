name: Trim YouTube Video

on:
  push:
    branches:
      - claude/trim-youtube-video-xHRQP
    paths:
      - '.github/workflows/trim-youtube.yml'
  workflow_dispatch:

jobs:
  download-and-trim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y ffmpeg
          pip install -U yt-dlp
          pip install "yt-dlp-youtube-oauth2 @ git+https://github.com/coletdjnz/yt-dlp-youtube-oauth2"
          yt-dlp --version

      - name: Start OAuth2 and post auth link to GitHub Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Start yt-dlp with OAuth2 in background
          yt-dlp \
            --username oauth2 --password "" \
            --download-sections "*35:00-39:00" \
            --force-keyframes-at-cuts \
            -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
            -o "clip_35-39.%(ext)s" \
            "https://www.youtube.com/watch?v=KC5kNsHYHpM" 2>&1 | tee /tmp/ytdlp_out.txt &
          YTDLP_PID=$!

          echo "Waiting for OAuth2 URL..."
          for i in $(seq 1 60); do
            if grep -q "google.com/device" /tmp/ytdlp_out.txt 2>/dev/null; then
              echo "Found OAuth2 URL"
              break
            fi
            sleep 2
          done

          cat /tmp/ytdlp_out.txt

          OAUTH_URL=$(grep -oE "https://[^ ]+" /tmp/ytdlp_out.txt | grep "google.com/device" | head -1)
          CODE=$(grep -oE "[A-Z0-9]{4}-[A-Z0-9]{4}" /tmp/ytdlp_out.txt | head -1)

          echo "URL: $OAUTH_URL"
          echo "Code: $CODE"

          if [ -n "$OAUTH_URL" ]; then
            gh issue create \
              --repo sergeystepanovich/thailand-adventure \
              --title "Открой на телефоне чтобы скачать видео" \
              --body "Открой эту ссылку на телефоне: ${OAUTH_URL}

Код для ввода: ${CODE}

После авторизации видео скачается автоматически."
            echo "Issue created!"
          else
            echo "OAuth2 URL not found in output:"
            cat /tmp/ytdlp_out.txt
            kill $YTDLP_PID 2>/dev/null
            exit 1
          fi

          # Wait for download (user has ~10 min to authorize)
          wait $YTDLP_PID
          ls -lh clip_35-39.*

      - name: Publish as GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete youtube-clip-35-39 --repo sergeystepanovich/thailand-adventure --yes 2>/dev/null || true
          gh release create youtube-clip-35-39 clip_35-39.* \
            --repo sergeystepanovich/thailand-adventure \
            --title "YouTube clip 35:00-39:00" \
            --notes "KC5kNsHYHpM (35:00–39:00)"
