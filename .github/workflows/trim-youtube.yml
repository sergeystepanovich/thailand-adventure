name: Trim YouTube Video

on:
  push:
    branches:
      - claude/trim-youtube-video-xHRQP
    paths:
      - '.github/workflows/trim-youtube.yml'
  workflow_dispatch:

jobs:
  download-and-trim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y ffmpeg
          pip install -U yt-dlp

      - name: Try Invidious instances to get stream URL
        run: |
          VIDEO_ID="KC5kNsHYHpM"
          STREAM_URL=""

          for INSTANCE in \
            "invidious.snopyta.org" \
            "inv.riverside.rocks" \
            "y.com.sb" \
            "invidious.tiekoetter.com" \
            "yt.artemislena.eu" \
            "invidious.flokinet.to" \
            "iv.melmac.space" \
            "invidious.privacydev.net"; do

            echo "Trying $INSTANCE..."
            RESP=$(curl -sf --max-time 15 "https://$INSTANCE/api/v1/videos/$VIDEO_ID" 2>/dev/null)
            if [ -z "$RESP" ]; then
              echo "  -> no response"
              continue
            fi

            URL=$(echo "$RESP" | python3 -c "
import sys, json
try:
    d = json.load(sys.stdin)
    streams = d.get('formatStreams', [])
    for s in streams:
        if 'mp4' in s.get('container','') or 'mp4' in s.get('type',''):
            print(s['url'])
            break
except: pass
" 2>/dev/null)

            if [ -n "$URL" ]; then
              echo "  -> GOT URL via $INSTANCE"
              echo "$URL" > /tmp/stream_url.txt
              STREAM_URL="$URL"
              break
            else
              echo "  -> no stream URL in response"
            fi
          done

          if [ -z "$STREAM_URL" ]; then
            echo "All Invidious instances failed, trying yt-dlp with invidious extractor..."
            yt-dlp \
              --extractor-args "youtube:player_client=web_embedded" \
              --get-url \
              -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
              "https://www.youtube.com/watch?v=$VIDEO_ID" > /tmp/stream_url.txt 2>&1 || true
            cat /tmp/stream_url.txt
          fi

          [ -s /tmp/stream_url.txt ] || { echo "No stream URL found"; exit 1; }
          echo "Stream URL: $(head -c 100 /tmp/stream_url.txt)..."

      - name: Trim 35:00-39:00 with ffmpeg
        run: |
          URL=$(cat /tmp/stream_url.txt)
          ffmpeg -ss 00:35:00 -i "$URL" -t 00:04:00 -c copy clip_35-39.mp4
          ls -lh clip_35-39.mp4

      - name: Publish as GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete youtube-clip-35-39 --repo sergeystepanovich/thailand-adventure --yes 2>/dev/null || true
          gh release create youtube-clip-35-39 clip_35-39.mp4 \
            --repo sergeystepanovich/thailand-adventure \
            --title "YouTube clip 35:00-39:00" \
            --notes "KC5kNsHYHpM (35:00–39:00)"
