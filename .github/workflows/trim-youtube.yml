name: Trim YouTube Video

on:
  push:
    branches:
      - claude/trim-youtube-video-xHRQP
    paths:
      - '.github/workflows/trim-youtube.yml'
  workflow_dispatch:

jobs:
  download-and-trim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y ffmpeg tor
          pip install -U yt-dlp
          # Start Tor and wait for it to connect
          sudo service tor start
          sleep 30
          echo "Tor started"

      - name: Download clip via Tor
        run: |
          yt-dlp \
            --proxy socks5://127.0.0.1:9050 \
            --download-sections "*35:00-39:00" \
            --force-keyframes-at-cuts \
            -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
            -o "clip_35-39.%(ext)s" \
            "https://www.youtube.com/watch?v=KC5kNsHYHpM"
          ls -lh clip_35-39.*

      - name: Publish as GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete youtube-clip-35-39 --repo sergeystepanovich/thailand-adventure --yes 2>/dev/null || true
          gh release create youtube-clip-35-39 clip_35-39.* \
            --repo sergeystepanovich/thailand-adventure \
            --title "YouTube clip 35:00-39:00" \
            --notes "KC5kNsHYHpM (35:00–39:00)"
