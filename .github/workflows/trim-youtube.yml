name: Trim YouTube Video

on:
  push:
    branches:
      - claude/trim-youtube-video-xHRQP
    paths:
      - '.github/workflows/trim-youtube.yml'
  workflow_dispatch:

jobs:
  download-and-trim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - name: Install yt-dlp and ffmpeg
        run: |
          sudo apt-get update -q && sudo apt-get install -y ffmpeg
          pip install -U yt-dlp

      - name: Start OAuth2 login + post URL to GitHub Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run yt-dlp oauth2 in background, capture output
          yt-dlp --username oauth2 --password "" \
            --download-sections "*35:00-39:00" \
            --force-keyframes-at-cuts \
            -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
            -o "clip_35-39.%(ext)s" \
            "https://www.youtube.com/watch?v=KC5kNsHYHpM" 2>&1 | tee /tmp/ytdlp_out.txt &
          YTDLP_PID=$!

          # Wait up to 30s for the OAuth2 URL to appear
          for i in $(seq 1 30); do
            if grep -q "google.com/device" /tmp/ytdlp_out.txt 2>/dev/null; then
              break
            fi
            sleep 1
          done

          # Post the URL to a GitHub Issue so you can open it on your phone
          OAUTH_LINE=$(grep -o "https://www.google.com/device[^ ]*" /tmp/ytdlp_out.txt | head -1)
          CODE=$(grep -oE "[A-Z0-9]{4}-[A-Z0-9]{4}" /tmp/ytdlp_out.txt | head -1)
          echo "OAuth URL: $OAUTH_LINE  Code: $CODE"

          if [ -n "$OAUTH_LINE" ]; then
            gh issue create \
              --repo sergeystepanovich/thailand-adventure \
              --title "🔑 Открой на телефоне чтобы скачать видео" \
              --body "**Открой эту ссылку на телефоне:**

$OAUTH_LINE

**Введи код:** \`$CODE\`

После авторизации видео скачается автоматически."
          fi

          # Wait for yt-dlp to finish (user has ~10 min to authorize)
          wait $YTDLP_PID
          ls -lh clip_35-39.* 2>/dev/null || { echo "Download failed"; cat /tmp/ytdlp_out.txt; exit 1; }

      - name: Publish as GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete youtube-clip-35-39 --repo sergeystepanovich/thailand-adventure --yes 2>/dev/null || true
          gh release create youtube-clip-35-39 clip_35-39.* \
            --repo sergeystepanovich/thailand-adventure \
            --title "YouTube clip 35:00-39:00" \
            --notes "KC5kNsHYHpM (35:00–39:00)"
