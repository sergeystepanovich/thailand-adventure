name: Trim YouTube Video

on:
  push:
    branches:
      - claude/trim-youtube-video-xHRQP
    paths:
      - '.github/workflows/trim-youtube.yml'
  workflow_dispatch:

jobs:
  download-and-trim:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y ffmpeg
          pip install -U yt-dlp
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Extract po_token + visitor_data via real Chromium
        run: |
          cat > get_pot.js << 'JSEOF'
          const { chromium } = require('./node_modules/playwright');
          const fs = require('fs');

          let poToken = null, visitorData = null;

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: [
                '--no-sandbox', '--disable-dev-shm-usage',
                '--disable-blink-features=AutomationControlled',
                '--autoplay-policy=no-user-gesture-required'
              ]
            });
            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36',
              viewport: { width: 1920, height: 1080 }
            });
            const page = await context.newPage();

            await page.addInitScript(() => {
              Object.defineProperty(navigator, 'webdriver', { get: () => false });
              Object.defineProperty(navigator, 'plugins', { get: () => [1,2,3,4,5] });
            });

            // Intercept player API requests to steal po_token
            await page.route('**/youtubei/v1/player**', async route => {
              const req = route.request();
              try {
                const body = JSON.parse(req.postData() || '{}');
                if (body?.serviceIntegrityDimensions?.poToken) {
                  poToken = body.serviceIntegrityDimensions.poToken;
                  process.stderr.write('po_token FOUND: ' + poToken.substring(0,40) + '...\n');
                }
                if (body?.context?.client?.visitorData) {
                  visitorData = body.context.client.visitorData;
                  process.stderr.write('visitor_data FOUND: ' + visitorData.substring(0,40) + '...\n');
                }
              } catch(e) {}
              await route.continue();
            });

            process.stderr.write('Loading YouTube...\n');
            await page.goto('https://www.youtube.com/watch?v=KC5kNsHYHpM', {
              waitUntil: 'domcontentloaded', timeout: 30000
            });
            await page.waitForTimeout(4000);

            const title = await page.title();
            process.stderr.write('Title: ' + title + '\n');

            for (const sel of ['[aria-label="Accept all"]', 'button:has-text("Accept all")']) {
              try { await page.click(sel, { timeout: 1500 }); break; } catch(e) {}
            }
            await page.waitForTimeout(2000);

            // Force play to trigger player API call
            await page.evaluate(() => {
              const v = document.querySelector('video');
              if (v) { v.muted = true; v.play(); }
            }).catch(() => {});

            await page.waitForTimeout(10000);

            process.stderr.write('po_token: ' + (poToken ? 'YES' : 'NO') + '\n');
            process.stderr.write('visitor_data: ' + (visitorData ? 'YES' : 'NO') + '\n');

            if (poToken) fs.writeFileSync('/tmp/po_token.txt', poToken);
            if (visitorData) fs.writeFileSync('/tmp/visitor_data.txt', visitorData);

            // Always save cookies too
            const cookies = await context.cookies();
            let cf = '# Netscape HTTP Cookie File\n';
            for (const c of cookies) {
              const d = c.domain.startsWith('.') ? c.domain : '.' + c.domain;
              cf += `${d}\tTRUE\t${c.path}\t${c.secure?'TRUE':'FALSE'}\t${c.expires>0?Math.floor(c.expires):2147483647}\t${c.name}\t${c.value}\n`;
            }
            fs.writeFileSync('/tmp/yt_cookies.txt', cf);
            process.stderr.write('Saved ' + cookies.length + ' cookies\n');

            await browser.close();
          })().catch(e => process.stderr.write('Error: ' + e.message + '\n'));
          JSEOF
          node get_pot.js
          echo "po_token exists: $([ -f /tmp/po_token.txt ] && echo YES || echo NO)"
          echo "visitor_data exists: $([ -f /tmp/visitor_data.txt ] && echo YES || echo NO)"

      - name: Download and trim with yt-dlp + po_token
        run: |
          YTDLP_ARGS="--download-sections '*35:00-39:00' --force-keyframes-at-cuts -f 'bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best' -o 'clip_35-39.%(ext)s'"

          if [ -f /tmp/po_token.txt ] && [ -f /tmp/visitor_data.txt ]; then
            PO_TOKEN=$(cat /tmp/po_token.txt)
            VISITOR_DATA=$(cat /tmp/visitor_data.txt)
            echo "Using po_token + visitor_data"
            yt-dlp \
              --po-token "web+https://www.youtube.com/+${PO_TOKEN}" \
              --extractor-args "youtube:visitor_data=${VISITOR_DATA}" \
              --cookies /tmp/yt_cookies.txt \
              --js-runtimes node \
              --download-sections "*35:00-39:00" \
              --force-keyframes-at-cuts \
              -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
              -o "clip_35-39.%(ext)s" \
              "https://www.youtube.com/watch?v=KC5kNsHYHpM"
          else
            echo "No po_token, trying with cookies only"
            yt-dlp \
              --cookies /tmp/yt_cookies.txt \
              --js-runtimes node \
              --download-sections "*35:00-39:00" \
              --force-keyframes-at-cuts \
              -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
              -o "clip_35-39.%(ext)s" \
              "https://www.youtube.com/watch?v=KC5kNsHYHpM"
          fi
          ls -lh clip_35-39.*

      - name: Publish as GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete youtube-clip-35-39 --repo sergeystepanovich/thailand-adventure --yes 2>/dev/null || true
          gh release create youtube-clip-35-39 clip_35-39.* \
            --repo sergeystepanovich/thailand-adventure \
            --title "YouTube clip 35:00-39:00" \
            --notes "KC5kNsHYHpM (35:00–39:00)"
